<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Welcome to my site.">
  <title>Welcome</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(ellipse at 15% 15%, #e1e9ff, transparent 55%), radial-gradient(ellipse at 85% 85%, #e8e1f9, transparent 55%), #f8f9fc;
      color: #20263b;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 56rem);
      padding: clamp(2rem, 7vw, 5rem);
      text-align: center;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 2rem;
      box-shadow: 0 24px 80px rgba(46, 57, 100, 0.08);
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.75rem);
      font-weight: 650;
      line-height: 1.2;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }
  </style>
</head>
<body>
  <main><h1>Hello, welcome to my site!</h1></main>
</body>
</html>
